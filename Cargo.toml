[package]
name = "mure"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "コーディングエージェントを並べて動かす、ちょうどいいターミナル"
license = "MIT"

[dependencies]
ratatui = "0.29"
vt100 = "0.15"
portable-pty = "0.8"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
lto = "thin"
strip = true
